<script>
var KEY='kinphrase_v1',LIMIT=5000,TH=0.75;
var MODES={w:'単語',e:'例文',dp:'派生語①　動・名・形・副・前・接',dr:'派生語②　類・同・反・関・例・略・複',all:'すべてまとめて'};
var SEEDS=[{n:'1–100',v:1,t:"001 | anyway | 副 | とにかく、それはそうと | 【顔文字】何事もやってみないと始まりません。 | Let's try [[anyway]]. | [[とにかく]]やってみよう。\n002 | following | 前・形 | ～の後で／次の、下記の | 【※】「次の、下記の」の意味の形容詞として設問文に入っているが、after の意味の前置詞用法も重要。 | [[Following]] the meeting, we had lunch. | 会議の[[後]]、我々はランチをとった。 | 動^follow^従う、後についていく;;例^X is followed by Y^XのあとにYが続く\n003 | refer | 動 | 参照する、言及する、(人を)紹介する | 【※】refer to(～を参照する、～に言及する)の形で頻出。他動詞でも出る。 | Please [[refer]] to the map. | 地図を[[参照し]]てください。 | 例^He was referred to a doctor.^彼は医師を紹介された;;名^reference^推薦(状)、照会(先)、参照;;名^referral^紹介\n004 | employee | 名 | 従業員、社員 | 【顔文字】TOEICの世界には、社員に優しいホワイト企業しか存在しない。 | all company [[employee]]s | 会社の全[[従業員]] | 動^employ^雇う、用いる;;名^employer^雇用主;;名^employment^雇用\n005 | offer | 動・名 | 申し出る、提供する／申し出、オファー | 【※】不定詞を伴うほか、SVOOの形も重要。 | What does the man [[offer]] to do? | 男性は何をすることを[[申し出て]]いますか。 | 例^We offered him a job.^我々は彼に仕事をオファーした;;名^offering^提供物(会社が提供する製品・サービス)\n006 | likely | 副・形 | おそらく、たぶん／ありそうな、～しそうな | 【※】設問文に most likely(おそらく)とあれば、100%そうとは言い切れないが話や文書の内容から最も正解の可能性が高いと推測できる答えを選ぼう。 | Where do the speakers most [[likely]] work? | 話し手は[[おそらく]]どこで働いていますか。 | 名^likelihood^可能性;;反^unlikely^～しそうもない\n007 | provide | 動 | 提供する、供給する | 【※】provide X with Y(XにYを提供する)の形も押さえよう。 | [[provide]] information about a product | 製品に関する情報を[[提供する]] | 名^provision^提供、条項;;名^provider^プロバイダー、供給業者\n008 | available | 形 | 入手できる、利用できる、都合がつく | 【※】「都合がつく」の意味でも出る。 | Tickets are [[available]] online. | チケットはオンラインで[[入手可能]]です。 | 例^I'm available this afternoon.^私は今日の午後は都合がつきます;;名^availability^都合、入手可能性;;反^unavailable^手に入らない、都合がつかない\n009 | conference | 名 | (フォーマルな)会議 | | speak at a [[conference]] | [[会議]]で話す | 例^press conference^記者会見;;例^conference call^電話会議;;例^videoconference^ビデオ会議;;例^teleconference^遠隔会議;;類^convention^(専門的で大規模な)会議\n010 | purchase | 動・名 | 購入する／購入(品) | 【※】名詞でも頻出。パート1でも出る。 | [[purchase]] a book | 本を[[購入する]] | 例^make a purchase^購入する;;例^A customer is making a purchase.^客が購入している\n011 | include | 動 | 含む | | The price [[include]]s breakfast. | 料金には朝食を[[含み]]ます。 | 前^including^～を含めて;;例^open every day including holidays^祝日も含め毎日営業する;;反^exclude^除外する;;前^excluding^～を除いて\n012 | department | 名 | (会社などの)部、売り場、省、局、学科 | 【※】「大型店の売り場」の意味も重要。 | the sales [[department]] | [[営業部]] | 例^a furniture department^家具売り場;;形^departmental^部門の;;例^department store^デパート;;類^division^部門\n013 | contact | 動・名 | 連絡する／連絡(先)、つて | 【※】名詞でも出る。 | [[Contact]] the manager | マネージャーに[[連絡する]] | 例^contact information^連絡先情報;;例^business contacts^仕事上のつて;;例^get in touch with^～と連絡を取る\n014 | according to | 前 | ～によれば、～に従って | 【※】「計画やルール等に従って」の意味も押さえよう。 | [[According]] to the speaker, what has changed? | 話し手[[によれば]]、何が変わりましたか。 | 例^according to plan^計画通りに;;副^accordingly^したがって、それに応じて;;例^in accordance with^～に従って\n015 | client | 名 | 顧客、取引先、クライアント | 【※】専門家や会社に対価を払ってサービスを受ける顧客のこと。 | meet with a [[client]] | [[顧客]]と会う | 類^customer^(店などの)客;;類^guest^(ホテルの)客、招待客;;類^visitor^訪問客;;類^tourist^観光客;;類^clientele^(集合的に)顧客\n016 | review | 動・名 | 見直す、再検討する、レビューする／再検討、レビュー | 【※】「re(再び)+view(見る)」が語源で、「しっかり見直す」イメージ。「レビュー(する)」の意味でも出る。 | [[review]] a presentation | プレゼンを[[見直す]] | 例^book review^本のレビュー;;例^performance review^業績評価;;名^reviewer^レビュアー\n017 | indicate | 動 | 示す、示唆する | 【※】パート7の設問文に indicate が入っていたら、解答の根拠が直接的に本文で示されていない場合と、推測しなければならない場合があることに注意。indicate (that) SV(～ということを示す)の形をとる語法も重要。 | What is [[indicate]]d about the hotel? | ホテルについて何が[[示されて]]いますか。\n018 | attend | 動 | 出席する、対応する | 【※】attend to(～に対応する)の自動詞用法も押さえよう。 | [[attend]] a workshop | ワークショップに[[出席する]] | 例^attend to the needs of^～のニーズに応える;;名^attendance^出席、出席者数;;名^attendee^出席者;;名^attendant^係員\n019 | hire | 動・名 | (一時的に)雇う／採用者 | 【顔文字】TOEICの世界では、採用条件を満たしていないにもかかわらず、自信満々に応募する人が後を絶たない。//【※】名詞でも出る。 | [[hire]] new staff | 新しいスタッフを[[雇う]] | 例^He's a new hire.^彼は新規採用者だ\n020 | local | 形・名 | 地元の、地方の、各駅停車の／地元の人 | 【※】必ずしも「地方の」の意味ではない(都会でも地元ならlocal)。名詞(常に複数形)でも出る。 | [[local]] businesses | [[地元]]の会社 | 例^locals and tourists^地元の人と観光客;;副^locally^地元で;;例^local train^各駅停車の電車\n021 | repair | 動・名 | 修理する、修繕する／修理、修繕 | 【顔文字】TOEICの世界では、故障が多発するので、repair person(修理工)が大活躍する。 | [[repair]] a computer | コンピュータを[[修理する]] | 類^fix^修理する;;類^patch^(継ぎをあてて)修繕する\n022 | article | 名 | 記事、(同種の物の)1つ | 【顔文字】TOEICの問題は配点が同じなので、パート7では、難易度の高い長めの記事問題は優先順位を下げるのも試験戦略の1つ。//【※】「同種の物の1つ」の意味も押さえよう。 | write an [[article]] | [[記事]]を書く | 例^an article of clothing^衣料品1点\n023 | update | 動・名 | 更新する、最新情報を伝える／最新情報、更新 | 【※】an updated list(更新されたリスト)のように過去分詞が名詞を修飾する形も押さえよう。名詞でも頻出。 | [[Update]] a schedule | スケジュールを[[更新する]] | 例^provide an update^最新情報を提供する;;例^up-to-date^最新の、最新式の\n024 | advertise | 動 | 宣伝する、広告する | | [[advertise]] a cleaning service | 清掃サービスを[[宣伝する]] | 名^advertising^広告すること、広告業;;例^advertising agency^広告代理店;;名^advertisement^広告;;例^ad^広告;;名^advertiser^広告主\n025 | equipment | 名 | 機器、装備 | 【※】パート1では、「コピー機やプリンター→office equipment(事務機器)」「顕微鏡や試験管→laboratory equipment(実験器具)」といった言い換えに注意。 | purchase office [[equipment]] | [[事務機器]]を購入する | 動^equip^装備する、備え付ける\n026 | increase | 動・名 | 増える、増やす／増加 | 【※】他動詞や名詞でも出る。 | The cost may [[increase]]. | コストが[[増加する]]かもしれない。 | 例^increase sales^売上を伸ばす;;例^an increase in sales^売上の増加;;副^increasingly^ますます;;反^decrease^減少する、減少;;類^soar / skyrocket^急上昇する;;類^surge^急増\n027 | opening | 名・形 | (仕事の)空き、開業／初めの、開始の | 【※】「開業」の意味でも頻出。形容詞でも出る。 | post a job [[opening]] | [[求人(職の空き)]]を掲載する | 例^the grand opening^グランドオープン;;例^the opening speech^開会の挨拶\n028 | ship | 動・名 | 発送する、出荷する／船 | 【※】TOEICでは、主に動詞で出る。派生語も頻出。 | Your order was [[ship]]ped yesterday. | ご注文は昨日[[発送され]]ました。 | 名^shipment^発送、配送品;;名^shipping^発送、輸送;;例^receive a shipment^配送品を受け取る;;例^a shipping charge/rate^配送料\n029 | expect | 動 | 予期する、期待する | 【※】expect to do(～するだろうと思う)の形も頻出。 | Ms. Patel is [[expect]]ed to arrive tomorrow. | パテルさんは明日到着する[[予定だ]]。 | 例^I expect to arrive on time.^時間通りに着くと思います;;名^expectation^予測、期待;;反^unexpected^予期せぬ\n030 | recently | 副 | 最近 | 【※】「少し前に」の意味で、主に過去形や現在完了形とセットで用いられ、現在進行形では用いられない。これは動詞の時制問題の出題ポイントの1つ。 | I [[recently]] changed my email address. | 私は[[最近]]メールアドレスを変えました。 | 形^recent^最近の;;類^lately^最近、近ごろ\n031 | delivery | 名 | 配達(物)、話し方 | 【顔文字】TOEICの世界では、配達の際、中身の破損、種類・色・数・サイズ違い、誤配、遅れ、漏れ等、ありとあらゆるトラブルが発生する。ただし盗難は起こらない。//【※】動詞の deliver は多義語のページ参照。 | change a [[delivery]] date | [[配達日]]を変更する\n032 | supply | 名・動 | 用品、必需品、供給(量)／供給する | 【※】TOEICでは、主に名詞で出る。 | office [[supplie]]s | [[事務用品]] | 例^cleaning supplies^清掃用品;;例^supply cabinet/closet^備品棚;;名^supplier^納入業者、供給業者\n033 | feature | 動・名 | 呼び物にする、特集する／特徴、特集記事 | 【※】「目玉にする」イメージ。文脈によって「呼び物にする」「特集する」といった意味になる。名詞でも頻出。 | The event will [[feature]] live music. | そのイベントはライブ演奏を[[呼び物にする]]予定だ。 | 例^a feature of the hotel^そのホテルの特徴;;類^characteristic^特徴\n034 | require | 動 | 必要とする、要求する | 【※】他動詞で、能動態なら目的語をとる語法にも注意。(例文は受動態) | Staff are [[require]]d to wear a uniform. | スタッフは制服の着用を[[求められ]]ます。 | 名^requirement^要件、必要条件;;類^prerequisite^前提条件\n035 | process | 名・動 | 過程、プロセス／処理する、加工する | 【※】動詞でも頻出。 | the interview [[process]] | 面接の[[過程]] | 例^process an order^注文を処理する;;名^processing^加工、処理;;例^food processing^食品加工\n036 | construction | 名 | 建設 | | a [[construction]] company | [[建設]]会社 | 動^construct^建設する;;形^constructive^建設的な;;名^reconstruction^再建;;例^under construction^建設中\n037 | charge | 名・動 | 料金、責任／請求する、充電する | 【※】動詞でも出る。 | The service is provided free of [[charge]]. | そのサービスは[[無料]]で提供されます。 | 例^charge a fee^料金を請求する;;例^in charge of^～の責任者である;;動^recharge^再充電する;;形^rechargeable^再充電可能な\n038 | material | 名 | 材料、資料 | 【※】「資料」の意味でも頻出。パート1では、「本や雑誌→reading material(読み物)」の言い換えに注意。 | construction [[material]]s | [[建設資材]] | 例^promotional materials^販促資料\n039 | survey | 名・動 | アンケート調査／(アンケートで)調査を行う | 【※】「アンケート」は和製フランス語で、英語では survey や questionnaire(アンケート用紙)。動詞でも出る。 | complete a [[survey]] | [[アンケート]]に記入する | 例^Who was surveyed?^調査対象は誰でしたか;;類^research / study^研究、調査\n040 | submit | 動 | 提出する | 【※】LR問わず頻出。submit a request(依頼を出す)や submit a payment(支払いをする)も重要表現。 | [[submit]] a form | 用紙を[[提出する]] | 名^submission^提出(物);;類^file / hand in / turn in^提出する\n041 | create | 動 | 創造する、作り出す | 【※】他動詞で、能動態なら目的語が必要。 | [[Create]] a Web site | ウェブサイトを[[作る]]。 | 名^creation^創造、創作物;;形^creative^創造的な;;名^creativity^創造性;;副^creatively^創造的に;;名^creature^生き物\n042 | budget | 名・動・形 | 予算／予算に組み込む／格安の | 【※】動詞や形容 es^提携先企業;;例^partner with^〜と提携する\n621 | scratch | 動・名 | ひっかき傷をつける／ひっかき傷 | 【顔文字】TOEICの世界には、一攫千金を狙う人がいないので、スクラッチくじは存在しない。 | The screen was [[scratch]]ed. | 画面が[[傷つい]]た。 |\n622 | compensation | 名 | 報酬、補償、埋め合わせ | 【※】報酬パッケージは、給与や福利厚生を含む総報酬のこと。 | a [[compensation]] package | [[報酬]]パッケージ | 動^compensate^補償する;;例^compensate X for Y^XにYを補償する;;類^remuneration^報酬\n623 | steady | 形 | 安定した、着実な、一定の | 【※】「着実な」の意味でも出る。 | find a [[steady]] job | [[安定した]]仕事を見つける | 例^steady progress^着実な進歩;;副^steadily^着実に、徐々に;;例^rise steadily^着実に上昇する;;類^stable^安定した\n624 | enthusiastic | 形 | 熱心な、熱意のある、乗り気である | 【※】宗教を熱心に信仰する様子が原義で、何かに対して「熱心な」「熱い」様子を表す。 | an [[enthusiastic]] response to a suggestion | 提案に対する[[熱心な]]反応 | 副^enthusiastically^熱心に;;名^enthusiasm^熱意;;名^enthusiast^熱心な人、ファン\n625 | emerging | 形 | 新興の、新進の | 【※】水中や暗闇からぬっと姿を現す様子が原義の形容詞。「台頭する」「頭角を現す」イメージ。 | [[emerging]] markets | [[新興]]市場 | 例^emerging artists^新進アーティスト;;動^emerge^現れる\n626 | differ | 動 | 異なる | 【※】differ from(〜と異なる)は重要表現。 | How does TOEIC [[differ]] from TOEFL? | TOEICはTOEFLとどう[[異なり]]ますか。 | 形^different / differing^異なる;;名^difference^違い;;副^differently^異なって;;関^discrepancy^食い違い\n627 | critical | 形 | きわめて重要な、重大な、批判的な | | a [[critical]] factor | [[きわめて重要な]]要因 | 動^criticize^批判する;;名^criticism^批評、批判;;関^critic^批評家;;関^critique^批評(する);;関^critically acclaimed^評論家絶賛の;;類^crucial / vital^きわめて重要な\n628 | physician | 名 | 医師 | 【※】主に米語で、doctorのフォーマルな単語。 | consult a [[physician]] | [[医師]]に相談する | 関^dentist^歯科医;;関^surgeon^外科医;;関^veterinarian^獣医;;関^vet^獣医;;関^physical therapist^理学療法士\n629 | consistently | 副 | 常に、一貫して、いつも | 【※】「con(共に)+sist(=stand 立つ)」が語源で、「常に変わらず同じ姿勢で立っている」イメージ。 | [[consistently]] high performance | [[常に]]高いパフォーマンス | 形^consistent^安定した、一貫した;;名^consistency^一貫性\n630 | sector | 名 | (国の経済活動の)部門、分野 | | the manufacturing [[sector]] | 製造業[[部門]] | 類^division^(組織の)部門;;類^segment^部分、区分\n691 | capture | 動 | とらえる | 【顔文字】TOEICの世界には、戦争や犯罪が存在しないので、「捕獲する、逮捕」の意味では出ない。 | [[capture]] the audience's attention | 観客の注意を[[引く(とらえる)]] |\n692 | adequate | 形 | 十分な | 【※】「ad(〜に)+equ( rable | 形 | 好意的な、好ましい | 【顔文字】TOEICの世界にも、批判的なレビューは存在するが、必ず1つは良い点をほめる優しさがある。 | [[favorable]] reviews | [[好意的な]]レビュー | 名^favor^親切な行為;;副^favorably^好意的に;;関^in favor of^〜を支持して\n675 | asset | 名 | 財産、資産 | 【※】カタカナ語の「アセット」同様、会社や個人が持つ資産や、貴重な人や物を指す。例文のような形でパート7の推薦文にも頻出。 | Alicia is an [[asset]] to the team. | アリシアはチームにとっての[[財産]]です。\n676 | manner | 名 | やり方、方法、態度 | 【※】TOEICでは、複数形のmanners(マナー、行儀作法)の意味では出ない。in a timely mannerは、パート5でも出題例のある重要表現。「態度」の意味でも出る。 | in a timely [[manner]] | タイミングの良い[[やり方]]で | 例^a calm manner^落ち着いた態度\n677 | relief | 名 | 安心、安堵 | | That's a [[relief]]. | [[安心]]しました。 | 動^relieve^和らげる;;形^relieved^ほっとしている;;例^I'm relieved to hear that.^それを聞いてほっとしました\n678 | occupied | 形 | (部屋や席などが)使用中の、忙しい | 【※】反意語のunoccupied(空いている)と合わせてパート1でも頻出。 | The room is [[occupied]] right now. | その部屋は今[[使用中]]です。 | 例^All of the chairs are occupied.^椅子はすべて使用中だ;;動^occupy^占有する、占める;;名^occupancy^占有\n679 | alike | 副・形 | 同様に／似ている | 【※】TOEICでは、「X and Y alike(XもYも同様に)」の形の副詞で主に出る。 | teachers and students [[alike]] | 先生も生徒も[[同様に]] | 類^similarly / likewise^同様に\n680 | heavily | 副 | 大量に、大いに、激しく | 【※】「ヘビーユーザー」のように、重さではなく程度の大きさや頻度の多さを主に表すことに注意。 | invest [[heavily]] in research and development | 研究開発に[[多額の]]投資を行う | 例^rely heavily on^〜に大きく依存している;;例^heavy rain^大雨\n681 | outcome | 名 | 結果、成果 | 【※】会議や交渉、選挙等で最終的にcome out(出てくる)結果のこと。 | the [[outcome]] of a meeting | 会議の[[結果]] | 類^result^結果;;類^consequence^(決定や行動が招く)結果\n682 | persuade | 動 | 説得する、説得して〜させる、納得させる | 【※】persuade 〈人〉to do(人を説得して〜させる)やpersuade 〈人〉(that) SV(〜だと人を納得させる)といった形をとる。 | Peter was [[persuade]]d to change his mind. | ピーターは[[説得されて]]考えを変えた。 | 形^persuasive^説得力のある;;類^convince^納得させる、確信させる\n683 | confusing | 形 | わかりにくい、紛らわしい、混乱させるような | 【※】confused(混乱した、困惑した)との意味の違いにも注意。 | The instructions are [[confusing]]. | 指示書が[[わかりにくい]]。 | 例^I'm a bit confused.^少し混乱しています;;名^confusion^混乱;;動^confuse^混同する、困惑させる\n684 | dispose | 動 | 処分する | 【※】前置詞ofとセットで覚えよう。 | [[dispose]] of waste | 廃棄物を[[処分する]] | 名^disposal^処分;;例^waste disposal^廃棄物処理;;形^disposable^使い捨ての;;類^discard^捨てる\n685 | prominent | 形 | 有名な、目立った、傑出した | 【※】「pro(前に)+min(突き出る)→目立った、有名な」と意味が派生した。 | a [[prominent]] business leader | [[有名な]]ビジネスリーダー | 副^prominently^目立つように;;類^noticeable^目立った;;類^celebrated / renowned^有名な\n686 | faculty | 名 | (大学の)教員、学部 | 【※】TOEICでは、「大学教員」の意味で主に出る。 | both students and [[faculty]] | 学生と[[教員]]の両方 | 関^professor^教授;;関^president^学長;;関^dean^学部長;;関^board of trustees^理事会\n687 | in-house | 形・副 | 社内の、組織内の／社内で、組織内で | 【※】「家の中」の意味ではないことに注意。副詞でも出る。 | [[in-house]] designers | [[社内]]デザイナー | 例^Our products are made in-house.^当社の製品は社内で製造されています;;関^in-store^店内の\n688 | rapidly | 副 | 急速に | 【※】rapidly expand(急拡大する)やrapidly change(急速に変化する)といった形でも出る。 | a [[rapidly]] growing business | [[急]]成長中のビジネス | 形^rapid^急速な;;例^rapid growth^急成長\n689 | investigate | 動 | 調査する、研究する | 【顔文字】TOEICの世界には、犯罪が存在しないので、警察が「捜査する」の意味では出ない。 | [[investigate]] the cause | 原因を[[調査する]] | 名^investigation^調査;;例^investigative reporting^調査報道\n690 | apparently | 副 | どうやら〜らしい、多分、見たところ | | [[Apparently]], there was a problem. | [[どうやら]]、問題があった[[らしい]]。 | 形^apparent^見たところの、明白な;;類^probably^恐らく、多分\n641 | fairly | 副 | かなり、公平に | 【顔文字】TOEICでは、「かなり」の意味で主に出る。なお、TOEICの世界には、fairy(妖精)は存在しない。 | The process is [[fairly]] simple. | 手続きは[[かなり]]簡単です。\n642 | disturb | 動 | 邪魔をする | 【※】ホテルのドアノブにかける「Please do not disturb.(起こさないでください)」のサインでもおなじみの単語。 | I'm sorry to [[disturb]] you. | [[お邪魔して]]すみません。 | 名^disturbance^邪魔;;類^bother / interrupt^邪魔をする\n643 | modify | 動 | 修正する、変更する | 【※】計画や方法、契約などを微修正すること。 | [[modify]] a contract | 契約を[[修正する]] | 名^modification^修正、変更;;類^alter / change^変更する;;類^adapt^適合させる;;類^adjust^調整する;;類^revise^修正する\n644 | transform | 動 | 一変させる | 【※】transform X into Y(XをYに一変させる)は重要表現。 | [[Transform]] your dreams into reality with TOEIC! | TOEICで夢を現実に[[変え]]よう。 | 類^revolutionize^革命的変化を起こす;;類^turn X into Y^XをYに変える\n645 | eliminate | 動 | 取り除く、排除する | 【※】「敷居の外に追い出す」が原義で、不要なモノや望ましくないモノを完全に取り除くこと。 | [[eliminate]] security risks | 安全上のリスクを[[取り除く]] | 名^elimination^除去;;類^get rid of^〜を取り除く、片付ける;;類^exclude^除外する、排除する\n646 | removal | 名 | 除去、撤去 ^所有している\n609 | paycheck | 名 | 給料、給与支払小切手 | 【※】米国では、かつて給料は紙のpaycheck(給与支払小切手)で支給されていた。現在では9割以上がdirect deposit(口座振込)になったが、その名残でこの単語は「給料」の意味で使われている。 | receive a [[paycheck]] | [[給料]]を受け取る |\n610 | delete | 動 | 削除する | 【※】キーボードのDelete(削除)キーでもおなじみの単語。 | [[delete]] a file | ファイルを[[削除する]] | 類^remove^取り除く、取り去る;;類^erase^消す\n631 | workload | 名 | 仕事量 | 【顔文字】TOEICの世界では、仕事量が多いと周囲が必ず助けてくれるので、仕事で身体を壊すことはない。 | reduce a [[workload]] | [[仕事量]]を減らす | 関^workplace^仕事場、職場;;関^workforce^従業員(数)、労働力人口\n632 | fulfill | 動 | 満たす、果たす、実現する | 【※】「ful(フルに)fill(満たす)」こと。パート7の同義語問題では、accommodate(受け入れる)、meet / satisfy(満たす)との言い換えに注意。 | [[fulfill]] a request | 要望を[[満たす]] | 例^fulfillment center^配送センター\n633 | cite | 動 | (理由や例として)挙げる、引き合いに出す | 【※】設問文でも出る。 | [[cite]] an example | 例を[[挙げる]] | 例^What is NOT cited as part of Mr. Itami's work?^イタミさんの仕事の一部として挙げられていないことは何ですか\n634 | diverse | 形 | 多様な | | a [[diverse]] range of clients | [[多様な]]顧客層 | 名^diversity^多様性;;動^diversify^多様化する、多角化する;;類^varied / various^さまざまな\n635 | hopefully | 副 | できれば、願わくば | 【※】文修飾の形で主に用いられる。 | [[Hopefully]], she'll be there. | [[できれば]]、彼女にその場にいてほしい。 | 形^hopeful^期待している;;例^be hopeful (that) SV^〜を期待している;;動^hope^願う;;名^hope^希望\n636 | lately | 副 | 最近、近頃 | 【※】late(遅く)の意味ではないことと、通常現在完了形とセットで用いられる時制に注意。文修飾の形でも出る。 | I haven't seen Lisa [[lately]]. | [[最近]]リサを見ていない。 | 例^Lately, she has been working a lot.^最近、彼女はよく働いている;;類^recently^最近\n637 | brand-new | 形 | 新品の、真新しい | 【顔文字】日々新しいモノを求める女性を歌ったサザンオールスターズのヒットソングが『ミス・ブランニュー・デイ(MISS BRAND-NEW DAY)』。 | [[brand-new]] furniture | [[新品の]]家具 |\n638 | informal | 形 | 非公式の、形式ばらない | 【※】informal survey(非公式の調査)も重要表現。 | an [[informal]] discussion | [[非公式の]]話し合い | 副^informally^非公式に、形式ばらずに;;反^formal^正式な、フォーマルな;;関^formally^正式に\n639 | shortage | 名 | 不足 | 【※】必要なものがshort(足りない)状態のこと。文法・語彙問題の両方で出題例がある。 | material [[shortage]]s | 材料[[不足]] | 類^lack^不足(する)\n640 | portrait | 名 | 肖像画 | | paint a [[portrait]] | [[肖像画]]を描く | 動^portray^描写する;;関^landscape painting^風景画;;関^abstract painting^抽象画;;関^watercolor painting^水彩画;;関^oil painting^油絵\n651 | strive | 動 | (懸命に)努力する | 【顔文字】TOEICの世界では、努力は必ず実る。不定詞を伴う語法も重要。 | We're [[striv]]ing to improve our service. | 我々はサービス向上に[[努めて]]います。 | 類^attempt / try^試みる;;類^struggle^奮闘する、苦闘する\n652 | circumstance | 名 | 状況 | 【※】「circum(周囲)+stance(立つ)」が語源で、周囲を取り巻く状況のこと。 | under any [[circumstance]]s | どのような[[状況]]下でも | 類^condition / situation^状況、状態\n653 | adapt | 動 | 順応する、適合させる、改作する | 【※】adapt X to Y(XをYに適合させる)の他動詞用法も重要。「(本や演劇を映画等に)改作する」の意味でも出る。 | [[adapt]] to a new environment | 新しい環境に[[順応する]] | 例^adapt a novel into a film^小説を映画化する;;名^adaptation^改作、順応\n654 | luxury | 名 | 高級(品)、豪華さ、ぜいたく(品) | 【※】主に「名詞＋名詞」の形で出る。 | a [[luxury]] car | [[高級]]車 | 例^a luxury hotel^高級ホテル;;形^luxurious^豪華な、ぜいたくな;;例^a luxurious apartment^豪華なアパート\n655 | surprisingly | 副 | 驚くほど | 【※】品詞・語彙問題の両方で出題例がある。 | a [[surprisingly]] large number of people | [[驚くほど]]多くの人 | 名^surprise^驚き;;動^surprise^驚かす;;例^express surprise^驚きを表す;;形^surprising^驚くべき;;形^surprised^驚いた\n656 | suspend | 動 | 一時停止する、つるす | 【※】「sus(下に)+pend(つるす)」が語源で「宙ぶらりんにする」イメージ。パート1では「つるす」の意味で出る(P.109参照)。パンツをつり下げるのがsuspenders(サスペンダー)。 | [[suspend]] production | 生産を[[一時停止する]] | 類^halt^止める、停止\n657 | statistics | 名 | 統計(値)、統計学 | 【※】「統計(値)」の意味では複数扱い。 | the latest [[statistics]] | 最新の[[統計]] | 例^The statistics are correct.^その統計値は正しい;;形^statistical^統計の、統計上の;;副^statistically^統計的に\n658 | poll | 名・動 | 世論調査、アンケート調査／世論調査をする | 【※】たくさんの人に同じ質問をして意見を聞くこと。類義語のsurvey(アンケート調査)がさまざまな内容の複数の質問をするのに対し、pollはあるテーマについて1つの質問をする。 | the results of a [[poll]] | [[世論調査]]の結果 |\n659 | resign | 動 | 辞任する、辞職する | 【※】他動詞でも出る。 | [[resign]] from a position | 役職を[[辞任する]] | 例^Mr. Reed has resigned his position as CEO.^リードさんはCEOの職を辞した;;名^resignation^辞職、辞任、辞表;;類^retire^(定年や任期満了で)退職する\n660 | gratitude | 名 | 感謝 | 【※】トークや文書の目的を答える問題の選択肢で頻出する。 | express [[gratitude]] | [[感謝]]を表す | 例^(A) To show gratitude to a customer^客に感謝を示すため;;形^grateful^感謝している;;類^appreciation^感謝"},
{n:'701–800',i:'p701',v:6,c:1,t:"791 | screening | 名 | 上映、検査、選考 | 【※】「検査、選考」の意味でも出る。 | the first [[screening]] of a film | 映画の初[[上映]] | 例^security screening^保安検査;;例^applicant screening^応募者選考;;関^screen^スクリーン、上映する、選別する;;関^screenplay^(映画の)脚本\n792 | interruption | 名 | 中断 | 【※】「inter(間)+rupt(壊す)」が原義で、流れを止めること。 | service [[interruption]] | サービスの[[中断]] | 動^interrupt^邪魔をする、中断する;;例^Sorry to interrupt (you).^お話し中邪魔してすみません\n793 | discard | 動 | 捨てる | 【※】「トランプで手持ちのカードを捨てる」が語源。パート1でも出る。 | [[discard]] old books | 古本を[[捨てる]] | 例^She's discarding a piece of paper.^彼女は紙を捨てている;;類^dispose of^〜を処分する;;類^throw away^〜を捨てる\n794 | introductory | 形 | 入門の、導入の、発売特価の | 【※】「導入の、発売特価の」の意味も押さえよう。 | an [[introductory]] course | [[入門]]コース | 例^an introductory chapter^序章;;例^an introductory price^発売特価、お試し価格;;動^introduce^導入する、紹介する\n795 | sustainable | 形 | (環境に害を及ぼさずに)持続可能な | 【※】SDGsは、Sustainable Development Goals(持続可能な開発目標)の略。 | [[sustainable]] farming practices | [[持続可能な]]農法 | 動^sustain^維持する;;関^biodegradable^生分解性の;;関^renewable^再生可能な\n796 | thrive | 動 | 繁栄する、よく育つ | 【※】「(植物などが)よく育つ」の意味でも出る。 | The company is [[thriv]]ing. | 同社は[[繁栄し]]ている。 | 例^plants that thrive in the shade^日陰でよく育つ植物;;形^thriving^繁栄している、盛況な\n797 | frustrated | 形 | いらいらしている、欲求不満を抱く | 【顔文字】TOEICの世界には、突然いらいらを爆発させる人は存在しない。 | I'm [[frustrated]] with the service. | 私はそのサービスに[[いらいらし]]ています。 | 形^frustrating^いらだたせるような\n798 | respectively | 副 | (述べられた順に)それぞれ | 【※】ここでは、Tex=16, Masaya=18。//※派生語のrespectは多義語のページ参照。 | Tex and Masaya, 16 and 18, [[respectively]] | テックスとマサヤ、[[それぞれ]]16歳と18歳 | 形^respective^それぞれの;;関^respected^評判の高い;;関^respectful^敬意を持っている\n799 | spectacular | 形 | 壮観な、目を見張るような | 【※】見た目に強い印象を与える様子を表し、主に風景の描写で出る。 | a [[spectacular]] view of the city | 市の[[壮観な]]眺め | 類^breathtaking^息をのむような;;類^impressive / striking^印象的な;;類^magnificent^壮観な\n800 | compile | 動 | (1つに)まとめる、編集する | 【※】資料や情報を本やリストにまとめること。 | [[compile]] a list of suppliers | 納入業者のリストを[[まとめる]] | 名^compilation^(情報などを)編集したもの;;類^collect^集める、まとめる;;類^edit^編集する\n701 | on-site | 形・副 | 現地の、現場の／現地で、現場で | 【※】「その場所(site)の」という意味。文脈によって、「敷地内の」「社内の」「店内の」といった意味になる。副詞でも出る。 | The hotel has [[on-site]] parking. | そのホテルには[[敷地内の(現地の)]]駐車場がある。 | 例^Our pizzas are made on-site.^当店のピザは店内で作っています\n702 | inconvenience | 名 | 不便 | 【※】おわび文で主に出る。 | We apologize for the [[inconvenience]]. | ご[[不便]]をおかけして申し訳ございません。 | 形^inconvenient^不便な;;名^convenience^便利、好都合;;形^convenient^便利な、都合の良い;;副^conveniently^便利なように\n703 | mentor | 名・動 | 相談相手、助言者／指導する、助言する | 【※】主に職場で、経験が浅い人に助言を行う経験豊富な人のこと。TOEICでは、メンター制度(mentoring program)を導入している会社もよく登場する。助言を受ける側はmenteeと呼ばれる。 | Melanie will be your [[mentor]]. | メラニーがあなたの[[相談相手]]になります。 |\n704 | directory | 名 | (建物の)案内板、名簿 | 【顔文字】TOEICの世界では、建物内で場所を尋ねると、「そこの案内板に出てます」といった塩対応をよくされる。 | Where can I find the building [[directory]]? | 建物の[[案内板]]はどこにありますか。 | 例^a staff directory^スタッフ名簿\n705 | bin | 名 | (貯蔵用の大型の)容器、ごみ箱 | 【※】trash bin(ごみ箱)やoverhead bin(頭上の荷物入れ)といった形でも出る。日本語の「瓶」は英語ではglass bottleやjar(広口瓶)で、binとは無関係。 | empty a recycling [[bin]] | リサイクル[[容器]]を空にする |\n706 | expertise | 名 | 専門知識、専門技術 | 【※】expert(専門家)が持つ知識や技術を表す不可算名詞。 | an area of [[expertise]] | [[専門]]分野 | 名^expert^専門家;;形^expert^専門的な、専門家の;;副^expertly^うまく、巧みに\n707 | renowned | 形 | 有名な、高名な | 【※】特別なスキルや業績で多くの人々に知られていること。 | a [[renowned]] artist | [[有名な]]アーティスト | 類^famous / well-known / noted / celebrated^有名な;;類^legendary^レジェンドの\n708 | prototype | 名 | 試作品 | 【顔文字】量産品の元となる試作品や原型のこと。TOEICの世界でも、製品の開発競争は盛んで、保温した食べ物を100km離れた場所まで配達するドローンも登場した。 | develop a [[prototype]] | [[試作品]]を開発する |\n709 | showcase | 動・名 | 披露する／お披露目の場、ショーケース | 【※】TOEICでは、主に動詞で出る。ガラスのショーケースに入れて商品を展示するように、何かを見栄えよく披露するイメージ。名詞でも出る。 | [[showcase]] new products | 新製品を[[披露する]] | 例^an artist showcase^アーティストのお披露目の場\n710 | garment | 名 | 衣服 | 【※】clothes(服)のフォーマルな単語。パート1でも出題例がある。 | a [[garment]] factory | [[衣服]]工場 | 例^The woman is holding up a garment.^女性が衣服を持ち上げている\n721 | portfolio | 名 | 作品集、製品(サービス)一覧、有価証券(一覧) | 【※】「(コンテストや求人の応募用にまとめた過去の)作品集」の意味で主に出る。元々は公文書や作品を入れて持ち運ぶケースのことだったが、中に入っている資料や作品、情報そのものを指すようになった。 | create a design [[portfolio]] | デザインの[[作品集]]を作る |\n722 | browse | 動 | (店などで)見て回る、閲覧する、拾い読みする | 【顔文字】筆者も新刊が出たら書店を見て回るが、陰キャなので店員さんに話しかけたことは一度もない。パート1でも出る。 | [[browse]] a bookstore for new releases | 書店で新刊を[[見て回る]] | 例^The woman is browsing through a book.^女性が本を拾い読みしている\n723 | pastry | 名 | (パイやケーキなどの)焼き菓子 | 【顔文字】90年代、「ペイストリーシェフ」という名の競走馬がいて、筆者も勝たせてもらったことがある(TOEICの世界には、競馬は存在しない)。 | a [[pastry]] chef | [[焼き菓子]]のシェフ | 関^baked goods^(パンやケーキのようなオーブンで)焼いた物\n724 | durable | 形 | 耐久性のある、長持ちする | 【※】製品の特長を答える問題の選択肢にも出る。 | [[durable]] materials | [[耐久性のある]]素材 | 例^(C) They are durable.^それらは耐久性がある;;名^durability^耐久性、丈夫さ;;類^sturdy^頑丈な;;類^long-lasting^長持ちする\n725 | disruption | 名 | 混乱、中断 | 【※】停電で業務が止まるように、物事の通常の流れが乱れること。 | cause major [[disruption]]s | 大きな[[混乱]]を引き起こす | 動^disrupt^乱す、混乱させる;;形^disruptive^混乱をもたらす;;類^interruption^中断;;類^disturbance^混乱、妨げ\n726 | transit | 名 | 輸送、交通機関 | 【※】in transit(輸送中に)は重要表現。 | damage in [[transit]] | [[輸送]]中のダメージ | 例^a transit map^路線図;;例^public transit/transportation^公共交通機関\n727 | textile | 名 | 繊維、織物、布地 | 【※】一般的に、textileは加工前の素材、類義語のfabricは加工後の生地を指す。社名でも頻出。 | a [[textile]] manufacturer | [[繊維]]メーカー | 例^TEX Textiles^テックス繊維;;類^fabric^生地、織物;;関^fiber^繊維;;関^yarn^糸\n728 | landmark | 名 | (歴史的な)建物、名所、画期的な出来事 | 【※】東京タワーのような、その土地(land)の目印(mark)となるような高い建造物や自然物(山や大木等)のこと。 | a historic [[landmark]] | [[歴史的建造物]] |\n729 | fleet | 名 | (同一会社の)保有車両、保有機体(船舶) | 【※】組織で保有・管理している車、電車、航空機、船舶などのこと。元々は「艦隊」の意味だったが、他の乗り物のグループも指すようになった。 | a [[fleet]] of vehicles | [[保有車両]] | 関^vessel^船舶;;関^aircraft^航空機\n730 | overview | 名 | 概要、概観 | 【※】「over(越えて)+view(見る)こと→全体を見渡すこと→概要」と意味が広がった。give/provide an overview of(〜の概要を伝える)も重要表現。 | a project [[overview]] | プロジェクトの[[概要]] | 類^outline^概要(を説明する)\n741 | scenic | 形 | 景色の良い | | a region of [[scenic]] beauty | [[景色の美しい]]地域 | 名^scenery^風景、景色;;類^breathtaking^息をのむような;;類^picturesque^絵のように美しい;;類^spectacular^目を見張るような;;類^stunning^驚くほど美しい\n742 | specification | 名 | 仕様(書)、スペック | 【※】製品や機器、建物などの「スペック」のこと。 | product [[specification]]s | 製品[[仕様]] | 動^specify^明記する、具体的に述べる;;形^specific^特定の、具体的な;;副^specifically^特に、具体的には;;名^specif ere]] to company policies | 会社の規定に[[忠実に従う]] | 類^comply with / conform to^(規則等)に従う;;名^adhesive^接着剤\n868 | dispatch | 動・名 | 派遣する、発送する／派遣、発送、特派員報告 | 【※】パート7では、send(送る)やship(出荷する)との言い換えに注意。 | [[dispatch]] an engineer | 技術者を[[派遣する]] |\n869 | ample | 形 | 十分な、十分すぎるほどの | 【※】「十分すぎるほどの、有り余るほどの」といったニュアンスの形容詞。ample time(十分な時間)も重要表現。 | [[ample]] storage space | [[十分な]]収納スペース | 類^abundant / plentiful^豊富な;;類^adequate / sufficient^十分な\n870 | protocol | 名 | 手順、規約 | 【※】「(特定の状況や環境で順守すべき)手順、規約」という意味。safety/security protocols(安全手順)の形で主に出る。「外交儀礼」の意味もあるが、TOEICでは出ない。 | follow safety [[protocol]]s | 安全[[手順]]に従う | 類^procedure^手順\n871 | unveil | 動 | 公表する、明らかにする | 【※】類義語のreveal(明らかにする)同様、「veil(ベール)を取る」が語源で、新製品や計画を初めて公にすること。 | [[unveil]] a plan | 計画を[[公表する]] | 類^disclose^公開する、開示する\n872 | artisan | 名 | 職人、熟練工 | 【※】木工職人や鍛冶職人、陶工のように手作業でモノを作る職人のこと。 | local artists and [[artisan]]s | 地元の芸術家と[[職人]] | 類^craftspeople^職人\n873 | top-notch | 形 | 一流の、最高の | 【※】「top(トップ)+notch(レベル)の」という意味。 | [[top-notch]] customer service | [[一流の]]カスタマーサービス | 類^first-rate^一流の\n874 | distraction | 名 | 邪魔、気を散らすもの、気晴らし | 【※】「dis(離れた方向に)+tract(引く)」が語源で、仕事中の騒音のように注意をそらせるモノのこと。 | minimize [[distraction]]s at work | 職場での[[邪魔]]を最小限にする | 動^distract^(注意などを)そらす、気を散らす;;形^distracting^気を散らす\n875 | autograph | 名・動 | (有名人の)サイン／(有名人が)サインする | 【顔文字】TOEICの世界にも、著者のサイン会(book signing)は常に盛況である。読者が誰も来なかったり、知り合いがサクラで並んだりするサイン会は存在しない。 | Mr. Gupta will be here signing [[autograph]]s. | グプタさんがここに来て[[サイン]]をします。 |\n876 | influential | 形 | 影響力のある | 【顔文字】TOEICの世界にも、influencer(インフルエンサー)は存在し、企業のマーケティング活動に起用されている。 | an [[influential]] business leader | [[影響力のある]]ビジネスリーダー | 名^influence^影響(力);;動^influence^影響を与える\n877 | attribute | 動・名 | 〜によるものだと考える／特質、特性 | 【※】「at(〜に対して)+tribute(割り当てる、与える)」が語源。「attribute 結果 to 要因」の形で押さえよう。 | Amanda [[attribute]]s her success to luck. | アマンダは自身の成功を[[幸運によるものだと考えている]]。 |\n878 | dominate | 動 | 支配する、そびえ立つ | 【※】「そびえ立つ」の意味でも出る(景色を支配するイメージ)。 | [[dominate]] the market | 市場を[[支配する]] | 例^The building dominates the skyline.^その建物は空にそびえ立っている;;形^dominant^主要な、支配的な\n879 | breakdown | 名 | 内訳、明細、故障 | 【※】break down(細分化する、故障する)が名詞化した単語。TOEICでは、「内訳、明細」の意味で主に出る。 | a cost [[breakdown]] | コストの[[内訳]] |\n880 | sophisticated | 形 | (機械などが複雑で)高度な、精巧な、洗練された | 【※】元々は、「不純物が混ざった」という意外な意味。「単純ではない→複雑で高度な」「素朴ではない→洗練された」と意味が移り変わった。 | [[sophisticated]] equipment | [[高度な]]機器 | 例^a sophisticated design^洗練されたデザイン\n801 | surplus | 名・形 | 余剰、余分、黒字／余分の | 【※】「sur(上)+plus(プラス)」が原義で、必要以上の量のこと。budget surplus(財政黒字、予算剰余)も重要表現。 | a [[surplus]] of agricultural products | [[余剰]]農産物 | 類^leftover^残った、余った、余り;;類^excess^超過、余分な\n802 | prestigious | 形 | 権威ある、名高い、一流の | 【※】元々は、「手品でだますような」というネガティブな意味。「手品でだますような→人を魅了する影響力を持つ→権威ある」とポジティブな意味に変わった。 | a [[prestigious]] award | [[権威ある]]賞 | 名^prestige^名声\n803 | instrumental | 形 | 重要な役割を果たす、インストゥルメンタルの | 【※】be instrumental in (doing)(〜で重要な役割を果たす)は重要表現。音楽を奏でるのに重要な役割を果たすのがinstrument(楽器)。 | Ian was [[instrumental]] in organizing the event. | イアンはイベントの準備で[[重要な役割を果たした]]。 |\n804 | congestion | 名 | 渋滞、混雑 | 【顔文字】混んでいるからcongestion(語呂合わせ)。 | traffic [[congestion]] | 交通[[渋滞]] | 形^congested^混雑した、渋滞した\n805 | respected | 形 | 評判の高い、立派な | 【※】多くの人にrespect(尊敬)されている様子を表す。 | a highly [[respected]] firm | 非常に[[評判の高い]]会社 | 類^distinguished^高名な、優れた;;類^prestigious^権威ある、名高い;;類^renowned^高名な;;類^reputable^評判の良い、立派な\n806 | incur | 動 | 発生させる、こうむる、負う | 【※】「in(中に向かって)+cur(走る)」が語源で、好ましくないモノの中に自分が走り込むイメージ。経費や追加料金等を発生させる文脈で主に出る。 | expenses [[incur]]red during a business trip | 出張中に[[発生した]]経費 | 例^incur an extra fee^追加料金を発生させる\n807 | lengthy | 形 | 長時間の、長期にわたる、長々とした | 【※】品詞・語彙問題の両方で出題例がある。「長すぎる」というニュアンスでも用いられる。 | a [[lengthy]] discussion | [[長時間の]]議論 | 例^lengthy delays^長時間の遅延;;名^length^長さ;;動^lengthen^伸ばす\n808 | convey | 動 | 伝える、運搬する | 【顔文字】TOEICでは、「伝える」の意味で主に出る。TOEICの世界には、conveyor belt(ベルトコンベヤー)は存在するが、conveyor belt sushi(回転寿司)は存在しない。 | [[convey]] a message | メッセージを[[伝える]] |\n809 | resume | 動 | 再開する | 【※】TOEICでは、eの上にアクセント記号が付いていればrésumé(履歴書)、付いていなければresume(再開する)。発音も異なるので注意しよう。 | [[resume]] production | 生産を[[再開する]] |\n810 | eatery | 名 | 飲食店、レストラン | 【※】パート7では、restaurant(レストラン)との言い換えに注意。 | local shops and [[eaterie]]s | 地元の店や[[飲食店]] | 類^bistro^小さなレストラン;;類^café^カフェ;;類^diner^軽食堂、食事客;;関^appetizer^前菜;;関^entrée^メインディッシュ\n841 | seasoned | 形 | 熟練した、経験豊富な、ベテランの、味付けした | 【※】熟して食べごろのseason(季節)を迎えた果物のように、「(経験を重ねて)熟練した」という意味。 | a [[seasoned]] professional | [[熟練した]]プロ | 類^accomplished^熟練した;;類^experienced^経験豊富な;;形^seasonal^季節的な、季節の\n842 | overwhelming | 形 | 圧倒的な | 【※】「圧倒されるほど多い・大きい」といったニュアンスも表す。 | an [[overwhelming]] majority of people | [[圧倒的]]多数の人 | 例^an overwhelming workload^圧倒的な仕事量;;動^overwhelm^圧倒する;;副^overwhelmingly^圧倒的に\n843 | devoted | 形 | 献身的な、専門に取り扱っている | 【※】「すべてをささげる」イメージ。「専門に取り扱っている」の意味でも出る。 | a [[devoted]] fan | [[献身的な]]ファン | 例^a museum devoted to manga^マンガ専門ミュージアム;;動^devote^ささげる、そそぐ\n844 | shed | 名・動 | 物置、小屋／取り除く、(葉を)落とす | 【※】TOEICでは、ほぼ名詞で出る。パート1でも出題例がある。 | build a [[shed]] in the backyard | 裏庭に[[物置]]を建てる | 例^Garden tools are stored in a shed.^庭道具が物置に保管されている\n845 | outgoing | 形 | 社交的な、出ていく、退任する | 【顔文字】TOEICの世界には、シャイな性格の人は存在しない。「出ていく、退任する」の意味でも出る。 | an [[outgoing]] personality | [[社交的な]]性格 | 例^outgoing flights^出発便;;例^the outgoing president^退任する社長;;反^incoming^入ってくる\n846 | supplement | 名・動 | (別冊)付録、補足、サプリ／補う | 【※】サプリのように何かを補うモノのこと。動詞でも出る。 | the Sunday [[supplement]] of the newspaper | 新聞の日曜版の[[付録]] | 例^Tex supplements his income by writing books.^テックスは本を書くことで収入を補っている;;形^supplemental^補足の\n847 | fertilizer | 名 | 肥料 | 【顔文字】TOEICの世界では、農業やガーデニングが人気なので、この単語も頻出。 | organic [[fertilizer]] | 有機[[肥料]] | 関^compost^堆肥：生ごみや落ち葉などを土と混ぜて作った肥料;;関^soil^土\n848 | withstand | 動 | 耐える | 【※】厳しい気象条件やハードな使用に耐えること。「with(〜に対して)+stand(立つ)」が語源で、過酷な状況に立ち向かうイメージ。 | [[withstand]] high temperatures | 高温に[[耐える]] | 類^resist^抵抗する、耐える\n849 | authentic | 形 | 本格的な、本場の、本物の | 【※】料理を表す際に頻出するほか、「(芸術作品などが)本物の」の意味でも出る。 | [[authentic]] Italian dishes | [[本格的な]]イタリア料理 | 例^an authentic Ichiro autograph^イチローの本物のサイン\n850 | landlord | 名 | 家主、大家、地主 | 【※】自分の不動産を他人に貸す人のこと。 | [[landlord]]s and tenants | [[家主]]と入居者 | 類^owner / proprietor^オーナー、所有者\n831 | comparable | 形 | 同等の、似たような、匹敵する | 【※】似ていて比較可能な様子を表す。 | These smartphones are [[comparable]] in price. | これらのスマホは価格が[[同等]]だ。 | 動^compare^比較する;;名^comparison^比較;;副^comparatively^比較的;;類^equivalent^同等の\n832 | utilize | 動 | 利用する | 【※】use(使う)のフォーマルな単語。 | [[utilize]] resources | 資源を[[利用する]] | 類^employ^用いる、雇う;;類^make use of / take advantage of^〜を利用する\n833 | correspond | 動 | やり取りする、一致する、相当する | 【※】「手紙やメールでやり取りする」という意味。correspond to/with(〜と一致する、〜に相当する)の表現も押さえよう。 | [[correspond]] with clients | 顧客と[[やり取りする]] | 名^correspondence^やり取り、一致;;関^correspondent^特派員\n834 | quota | 名 | ノルマ、(生産、販売などの)割り当て | 【※】「ノルマ」は元々ロシア語。シベリアに抑留された日本人に課された「ノルマ」が、帰国後に日本で広まったとされる。 | a sales [[quota]] | 販売[[ノルマ]] | 関^quote^見積もり、見積もる\n835 | outing | 名 | (団体の)小旅行、遠足 | 【顔文字】TOEICの世界には、会社の電話を留守電設定し、平日にカンパニーピクニックを開催した会社が存在する。 | the annual company [[outing]] | 年に1度の社員[[旅行]]\n836 | flaw | 名 | 欠陥 | | find a [[flaw]] in a product | 製品の[[欠陥]]を見つける | 形^flawed^欠陥のある;;反^flawless^完ぺきな;;類^defect^欠陥、欠点;;類^glitch^不具合;;類^shortcoming^欠点、短所\n837 | rigorous | 形 | 厳格な、厳しい | | undergo [[rigorous]] testing | [[厳格な]]テストを受ける | 類^harsh / severe / strict^厳しい;;類^stringent^厳格な\n838 | recyclables | 名 | リサイクル可能な物 | 【※】名詞は常に複数形。 | [[recyclables]] such as cardboard and glass | 段ボールやガラスのような[[リサイクル可能な物]] | 形^recyclable^リサイクル可能な;;例^recyclable items^リサイクル可能な物;;動^recycle^リサイクルする;;名^recycling^リサイクル、再利用\n839 | vital | 形 | 不可欠な、きわめて重要な | 【※】「vit(命)に関わる→きわめて重要な」と意味が派生した。vitality(活力)やvitamin(ビタミン)も同語源。 | Regular exercise is [[vital]] for your health. | 定期的な運動は健康に[[不可欠]]だ。 | 関^revitalize^活性化する\n840 | undertake | 動 | 引き受ける、着手する | 【顔文字】時間のかかる難しい仕事や任務を引き受けて始めること。TOEICの世界には、できない仕事を無責任に引き受ける人は存在しない。 | [[undertake]] a project | プロジェクトを[[引き受ける]] | 名^undertaking^事業、企て\n851 | refrain | 動 | 控える | 【※】自動詞で、refrain from (doing)(〜を控える)の語法も重要。 | Please [[refrain]] from touching the exhibits. | 展示品に触れるのは[[控えて]]ください。\n852 | allocate | 動 | 割り当てる、配分する | 【※】allocate X for/to Y(XをYに割り当てる)の形で頻出。TOEICでは、資金や予算を割り当てる文脈で主に出る。 | [[allocate]] funds for research and development | 研究開発に資金を[[割り当てる]] | 名^allocation^割り当て\n853 | transcript | 名 | 成績証明書、文字起こし | 【※】大学の成績証明書のことで、パート7の求人の要件で出る。「(講演や会話などの)文字起こし」の意味も押さえよう。 | an official [[transcript]] | 公式の[[成績証明書]] | 例^a transcript of a speech^講演の文字起こし\n854 | trustee | 名 | 理事、管財人、受託者 | 【※】TOEICでは、「理事」の意味で出る。trust(信託)を受けて会社や学校、団体のお金の運用・管理を行う人たちのこと。 | a board of [[trustee]]s | [[理事]]会\n855 | adjacent | 形 | 隣接した | 【※】adjacent to(〜に隣接した)は重要表現。名詞を修飾する形でも出る。 | The café is [[adjacent]] to the theater. | そのカフェは劇場に[[隣接し]]ている。 | 例^an adjacent building^隣接したビル;;類^adjoining^隣の、隣り合った;;類^next to^〜の隣に\n856 | novice | 名 | 初心者、かけ出し、新米 | 【※】「名詞+名詞」の形で頻出。 | professional and [[novice]] cooks alike | プロの料理人も[[初心者]]の料理人も同様に | 例^a novice teacher^新米教師;;反^advanced^上級の;;反^intermediate^中級の;;類^beginner^初心者、ビギナー\n857 | subsidiary | 名 | 子会社 | 【顔文字】大きな会社をsub(下)で支える子会社のこと。TOEICの世界では、不祥事を起こして子会社に左遷になる人は存在しない。 | establish a [[subsidiary]] | [[子会社]]を設立する\n858 | periodic | 形 | 定期的な、周期的な | 【※】「一定のperiod(期間)ごとの」という意味。 | [[periodic]] maintenance of equipment | [[定期的な]]機器のメンテナンス | 副^periodically^定期的に、周期的に;;名^periodical^定期刊行物;;類^regular^定期的な\n859 | assorted | 形 | 詰め合わせの、盛り合わせの、雑多な | 【顔文字】筆者は玩具のバイヤー時代、「スター・ウォーズ ベーシックフィギュア 36個アソート」といった商品を発注していた。 | a box of [[assorted]] chocolates | [[詰め合わせの]]チョコレート1箱 | 名^assortment^詰め合わせ、盛り合わせ;;関^sort^仕分ける\n860 | understaffed | 形 | 人手不足の、人員不足の | 【※】パート3・4・7の選択肢でも出る。 | The restaurant is [[understaffed]]. | そのレストランは[[人手不足]]だ。 | 例^(A) The project is currently understaffed.^そのプロジェクトは現在人手不足だ;;類^short-staffed^人手不足の"},
{n:'901–1000',i:'p901',v:4,c:1,t:"921 | sturdy | 形 | 頑丈な | 【※】語彙問題でも出題例がある。つづりの似たstudyとの見間違いにも注意。 | a [[sturdy]] ladder | [[頑丈な]]はしご | 類^durable^耐久性のある、長持ちする;;類^robust^強固な;;類^solid^強固な\n922 | commemorate | 動 | (重要な出来事などを)祝う、記念する | 【※】「com(皆で)+memorate(思い出す)」が語源で、重要な出来事や偉大な人物を記念するために式典を開くこと。 | [[commemorate]] the town's 100th anniversary | 町の100周年を[[祝う]] | 形^commemorative^記念の\n923 | plaque | 名 | 盾、(記念)プレート | 【※】文字が刻まれた金属や石などの記念プレートのこと。表彰者に授与されたり、建物の壁に埋め込まれたりする。commemorative plaque(記念盾)は重要表現。 | present a commemorative [[plaque]] | 記念[[盾]]を贈呈する |\n924 | insulation | 名 | 断熱(材)、防音(材)、絶縁(体) | 【※】音や熱、電気などを通さないようにすることや、そのための材料のこと。 | install [[insulation]] in the walls | 壁に[[断熱材]]を入れる | 動^insulate^断熱(防音・絶縁)する;;類^soundproof^防音の;;類^waterproof^防水の\n925 | itemize | 動 | 項目に分ける、箇条書きにする | 【※】TOEICでは、請求書や領収書、経費報告書上で、品名、内容、金額、数量等、item(項目)別に明細を記す文脈で出る。 | attach an [[itemize]]d receipt | [[項目別]]のレシートを添付する |\n926 | compatible | 形 | 互換性のある | 【※】ハードとソフト、本体と周辺機器等が問題なく一緒に使えること。 | The software is [[compatible]] with the hardware. | そのソフトはそのハードと[[互換性があり]]ます。 | 名^compatibility^互換性\n927 | proofread | 動 | 校正する | 【顔文字】原稿や書類に目を通し、間違いを見つけて正すこと。TOEICの世界では、契約書の相手の社名が間違っているなど、校正漏れで、あり得ないミスが多発する。 | [[proofread]] a contract | 契約書を[[校正する]] | 名^proofreader^校正者\n928 | gala | 名 | 祝賀(会) | 【※】華やかで盛大な祝賀(会)のこと。パート2でも出る。 | hold a [[gala]] dinner | [[祝賀]]夕食会を開く | 例^Are you attending the gala dinner tomorrow?^明日の祝賀夕食会に出席しますか\n929 | inclement | 形 | (天気が)荒れ模様の | 【※】inclement weather(悪天候)の形でしか出ないので、セットで覚えよう。第二音節に強勢が置かれる発音にも注意。 | flight delays due to [[inclement]] weather | [[悪天候]]によるフライトの遅れ | 類^adverse weather conditions^悪天候\n930 | mural | 名 | 壁画 | 【顔文字】TOEICの世界では、壁画が人気。さまざまな店舗の壁画を、地元出身のアーティストが描く町おこしが行われたこともある。 | paint a [[mural]] | [[壁画]]を描く |\n971 | turnover | 名 | 離職率 | 【顔文字】「売上高」「(商品の)回転率」といった意味もあるが、TOEICでは「離職率」の意味で出る。なお、TOEICの世界には、離職率が高いブラック企業は存在しない。 | low employee [[turnover]] | 低い従業員[[離職率]] |\n972 | anonymous | 形 | 匿名の | 【※】TOEICでは、匿名の寄付や匿名の従業員アンケートといった文脈で出る。 | an [[anonymous]] donor | [[匿名の]]寄付者 | 副^anonymously^匿名で\n973 | intact | 形 | 無傷の | 【※】「in(否定)+tact(触れる)」が語源で、「触れられていない元の完全な状態」のイメージ。 | The package is [[intact]]. | 荷物は[[無傷]]です。 | 関^contact^con(共に)+tact(触れる)→連絡する\n974 | complement | 動・名 | 補完する／補完するもの | 【※】何かを補ってより complete(完全な)状態にすること。「良さを引き立たせる」イメージ。compliment(ほめる、賛辞)との混同にも注意。「complement の e」は complete の e と頭に入れよう。 | The sauce [[complement]]ed the dish well. | ソースが料理をうまく[[補完し]]ていた。 |\n975 | reproduce | 動 | 複製する、再現する、繁殖する | 【※】TOEICでは、「複製する、再現する」の意味で主に出る。 | obtain permission to [[reproduce]] images | 画像を[[複製する]]許可を得る | 名^reproduction^複製、再現;;類^duplicate^複製の、二重の、複製する、二重にする;;例^a duplicate key^合鍵\n976 | embark | 動 | 乗り出す、開始する、乗船する | 【※】「en(=in 中に)+bark(船)→船に乗り込む」が原義。embark on(〜に乗り出す、〜を開始する)の形で押さえよう。 | [[embark]] on a new project | 新プロジェクトに[[乗り出す]] |\n977 | compelling | 形 | 人を引きつける、説得力のある | 【※】compel(強制する)の現在分詞が形容詞化した形で、逆らえないほどの非常に強い説得力や魅力を持つ様子を表す。 | a [[compelling]] story | 人を[[引きつける]]ストーリー |\n978 | consecutive | 形 | 連続した | 【※】「4年連続」は、four consecutive years や four years in a row ともいう。 | for the fourth [[consecutive]] year | 4年[[連続]]で |\n979 | faucet | 名 | 蛇口 | 【顔文字】TOEICの世界では、蛇口から水がよく漏れる。漏れのあまりのひどさに、「こんなの見たことない」と配管工がつぶやくシーンが出題されたこともある。 | turn off a [[faucet]] | [[蛇口]]を締める | 類^tap^蛇口;;例^tap water^水道水\n980 | imperative | 形 | 絶対に必要な、必須の | 【※】「命令する」が語源で、「命令文」は imperative sentences。It is imperative that SV. の形では、常にVが原形になる語法(仮定法現在)にも注意。 | It is [[imperative]] that we act now. | 我々が今行動することが[[絶対に必要]]です。 |\n981 | inaugural | 形 | 初回の、就任(式)の | 【顔文字】「(シリーズの)初回の」という意味。TOEICの世界には、「大統領」が存在しないので、「大統領の就任演説」の意味の名詞では出ない。 | the [[inaugural]] issue of a journal | 専門誌の[[創刊(初回の)]]号 | 動^inaugurate^開始する、落成式を行う\n982 | rectangular | 形 | 長方形の | 【※】パート3で、メガネのフレームの形状を選ぶ図表問題での出題例もある。 | a [[rectangular]] table | [[長方形]]のテーブル | 関^square^正方形の;;関^round^円形の;;関^oval^楕円形の\n983 | ergonomic | 形 | 人間工学に基づいた | 【※】「人間工学(人間ができる限り効率よく快適に作業できる設計を研究する学問)に基づいた」という意味。家具等の製品紹介で主に出る。 | [[ergonomic]] office chairs | [[人間工学に基づいた]]オフィスチェア |\n984 | bolster | 動 | 強化する、高める、支える | 【※】語源は、ヨガなどで身体を支える細長い円筒形のクッション。そこから、「下支えする、補強する」 ile tool^万能ツール\n993 | intuitive | 形 | 直感的に使える、直感的な | 【※】TOEICでは、「(ソフトやアプリなどが簡単に)直感的に使える」の意味で出る。語彙問題でも出題例がある。 | The software is [[intuitive]]. | そのソフトは[[直感的に使え]]ます。 |\n994 | sequel | 名 | 続編 | 【※】本や映画、演劇などの続編のこと。パート7では、「シリーズ最新作→続編」の言い換えにも注意。 | write a [[sequel]] to a novel | 小説の[[続編]]を書く | 関^sequence^連続\n995 | replenish | 動 | 補充する、補給する | 【※】TOEICでは、在庫を補充する文脈で出る。語彙問題での出題例もある。 | [[replenish]] the stock | 在庫を[[補充する]] | 類^restock^補充する、補給する;;類^refill^補充(する)、再調剤(する)\n996 | commensurate | 形 | 相応の、釣り合った、見合った | 【※】「com(共に)+measure(測る)」が語源で、天秤ばかりを釣り合わせるイメージ。パート7の求人広告では、「給与は経験に応じる→入社時の給与は人によって異なる」といった選択肢での言い換えにも注意。 | Salary is [[commensurate]] with experience. | 給与は経験に[[応じ]]ます。 |\n997 | onboarding | 名 | 新人研修、オンボーディング | 【※】元々は、新たにon board(乗船・搭乗)した乗務員が業務に慣れるための制度。そこから、新入社員が会社に慣れるためのプロセスや、新規顧客がサービス・製品に慣れるためのサポート体制を指すようになった。 | [[onboarding]] process | [[新人研修]]プロセス |\n998 | resilience | 名 | 回復力 | 【※】困難な状況や出来事から立ち直る力を指し、ビジネスの世界でも重要視されている資質の1つ。 | [[resilience]] in a difficult situation | 困難な状況での[[回復力]] | 形^resilient^回復力のある;;類^persistence^粘り強さ;;関^overcome^克服する\n999 | reinvent | 動 | 生き方を変える、刷新する | 【※】reinvent oneselfは、直訳すると「自らを再発明する」で、「生き方を変える、新しい自分になる、再出発する」イメージの表現。TOEICのスコアアップで新しい自分になりましょう！ | It's time to [[reinvent]] yourself. | 今こそ[[生き方を変える]]時だ。 |\n1000 | exponentially | 副 | 飛躍的に、急激に | 【顔文字】そうなりますことを、著者として心より願っております。がんばってください。 | Your TOEIC score will increase [[exponentially]]. | あなたのTOEICスコアは[[飛躍的に]]伸びるでしょう。 |\n911 | crate | 名 | 木箱、ケース | 【※】果物や瓶などの運搬・収納用の木箱やケースのこと。パート1でも出る。 | a [[crate]] of vegetables | 野菜1[[箱]] | 例^Crates are being loaded into a truck.^木箱がトラックに積み込まれている\n912 | detour | 名・動 | 回り道／回り道をする | 【※】パート4の交通情報等で出る。make/take a detour(回り道をする、遠回りをする)は重要表現。 | take a [[detour]] | [[回り道]]をする | 類^bypass^う回する、う回路;;関^roundabout^(ドーナツ状の)環状交差点\n913 | raffle | 名 | (慈善目的の)くじ | 【※】購入した券の番号と当選番号が一致すると景品がもらえるくじのこと。慈善活動の資金集めのために行われる。 | participate in a [[raffle]] | [[くじ]]に参加する | 類^drawing^くじ引き、抽選(会)\n914 | cubicle | 名 | (仕切られた)個人用スペース | 【※】TOEICでは、パーティションで仕切られたオフィス内の個別の作業スペースの意味で出る。語源的なつながりはないが、形状が似ているcube(キューブ)をイメージすると覚えやすい。 | work in a [[cubicle]] | [[個人用スペース]]で作業する |\n915 | redeem | 動 | (クーポン券などを)引き換える | 【※】ポイントやcoupon / voucher(クーポン券)、gift certificate(ギフト券)などを現金や商品と引き換えること。 | Don't forget to [[redeem]] your points. | ポイントの[[引き換え]]をお忘れなく。 | 形^redeemable^引き換え可能な\n916 | stunning | 形 | 驚くほど美しい、見事な | 【※】stunは「気絶させる、あぜんとさせる」という意味で。stun gun(スタンガン)は人を気絶させる銃(TOEICでは出ない)。派生語のstunningは「気絶するほど美しい」「あぜんとするほど見事な」といったイメージ。 | [[stunning]] color photographs | [[驚くほど美しい]]カラー写真 |\n917 | outreach | 名 | 奉仕(福祉)活動 | 【※】助けを必要としている人に支援の手をreach out(差し伸べる)活動のこと。 | a community [[outreach]] program | 地域[[奉仕活動]]プログラム | 類^community service^社会奉仕\n918 | waive | 動 | 免除する、適用しない、(権利を)放棄する | 【※】TOEICでは、補償や特典として、本来発生する登録料や送料などを無料にする文脈で出る。 | We will [[waive]] the registration fee. | 登録料は[[免除いた]]します。 | 名^waiver^免除、権利放棄\n919 | rafting | 名 | (ゴムボートでの)川下り | 【顔文字】TOEICの世界では、川下りは人気のレジャーの1つ。旅行会社のツアープランにもときどき組み込まれている。 | take a [[rafting]] trip | [[川下り]]の旅をする |\n920 | refill | 名・動 | 再調剤、補充／補充する、再調剤する | 【顔文字】TOEICの世界では、同じ処方箋で何度も薬をrefill(再調剤)できる「リフィル処方箋」制度が一般的。頭に入れておこう。 | request a prescription [[refill]] | 処方薬の[[再調剤]]を求める |"},

重要表現。 | He is [[regarded]] as a national hero. | 彼は国民的英雄と[[みなさ]]れている。 | 例^She is a highly regarded chef.^彼女は高く評価されているシェフだ。;;例^in this regard^この観点で\n19 | complete | 動・形 | 記入する／完了する、完成させる、仕上げる／完了した、完成した／全部の | | [[complete]] a survey | アンケートに[[記入する]] | 例^complete a task^仕事を完了する;;例^All the work is complete.^作業はすべて完了している。;;例^a complete list of our products^当社全製品のリスト\n20 | copy | 名 | (本・雑誌等の)冊、部、枚 | 「コピー(する)」以外の意味。 | a [[copy]] of the book | その本1[[冊]] |\n21 | cover | 動 | 報道する、扱う／まかなう、補償する／代理をする | 「カバー、表紙、覆う」以外の意味。「カバーする」が基本イメージ。 | [[cover]] the news | ニュースを[[報道する]] | 例^cover the costs^コストをまかなう;;例^I can cover your shift.^私があなたのシフトを代わります。\n22 | credit | 名・動 | 信用貸し／称賛、功績／単位／入金する | 「credit card(クレジットカード)」以外の意味。 | store [[credit]] | 店内[[クーポン]](返金の代わりのクーポン券) | 例^You deserve credit for your hard work.^あなたの努力は称賛に値します。;;例^earn credits^単位を取得する;;例^Your account will be credited $30.^あなたの口座には30ドル入金されます。\n23 | deliver | 動 | 配達する、届ける／(演説等を)行う | 「(演説等を)行う」の意味でも出るのに注意(言葉を届けるイメージ)。 | [[deliver]] a product | 製品を[[配達する]] | 例^deliver a speech^スピーチを行う\n24 | direct | 形・動 | 直行の、直接の／向ける／道を教える／監督する／指示する | 「正しい方向に導く、向ける」が語源の多義語。 | take a [[direct]] flight | [[直行]]便に乗る | 例^How may I direct your call?^お電話をどちらにおつなぎしますか。;;例^direct customers to the checkout counter^お客様をレジカウンターに案内する;;例^The film was directed by Isao Miyazaki.^その映画はイサオ・ミヤザキが監督した。;;例^direct employees to work from home^従業員に在宅勤務を指示する\n25 | direction | 名 | 方向、方向性／道順／指示、監督 | | Some people are facing the same [[direction]]. | 数名が同じ[[方向]]を向いている。 | 例^driving directions^車での道順;;例^follow the directions^指示に従う\n26 | drill | 名 | (防災等の)訓練 | 工具の「ドリル」以外の意味。 | a safety [[drill]] | 安全[[訓練]] |\n39 | head | 動 | 向かう、向かわせる／率いる | 「頭、長」といった名詞以外の意味。 | I'm [[heading]] home. | 家に[[向かっ]]ています。 | 例^head a team^チームを率いる\n40 | health | 名 | 衛生 | 「健康」以外の意味。 | a [[health]] inspector | [[衛生]]検査官 |\n41 | hold | 動 | (イベント等を)開く／取っておく、確保する | 「しっかり持つ」以外の意味。 | [[hold]] a meeting | 会議を[[開く]] | 例^hold an item for a customer^客のために品物を取っておく\n42 | honor | 動・名 | 称える、栄誉を与える／(契約などを)守る／光栄に思う／敬意 | 「名誉(なこと)」以外の意味。 | [[honor]] Mr. Hamasaki's 30 years of service | ハマサキさんの勤続30年を[[称える]] | 例^honor a contract^契約を守る;;例^I'm honored to work with you.^あなたと仕事ができて光栄に思います。;;例^in honor of Ms. Nakamura^ナカムラさんに敬意を表して\n43 | house | 動 | 収容する、所蔵する | 「家」以外の動詞の意味。 | The building [[houses]] many restaurants and shops. | その建物には多くのレストランや店が[[入っている]]。 |\n44 | issue | 名・動 | 問題／(雑誌などの)号／出す、発行する | 「外に出す」「外に出てくるもの」が原義。 | safety [[issues]] | 安全性の[[問題]] | 例^the July issue of the magazine^雑誌の7月号;;例^issue a statement^声明を出す\n45 | land | 動 | 着陸する／(契約や仕事を)手に入れる | 「土地」以外の動詞の意味。 | We will be [[landing]] in half an hour. | 当機は30分後に[[着陸]]いたします。 | 例^land a job^仕事を手に入れる\n46 | last | 動・形 | 続く／もつ／この(すぐ)前の | 「最後の」以外の意味。 | The class will [[last]] two hours. | クラスは2時間[[続き]]ます。 | 例^Our products will last a lifetime.^当社製品は一生もちます。;;例^over the last two years^この2年間にわたって\n47 | leave | 名・動 | 休暇／残す／〜のままにする／任せる | 「出発する、去る」以外の意味。 | Ms. Kudo is on [[leave]]. | クドウさんは[[休暇]]中です。 | 例^leave a message^伝言を残す;;例^Leave the door open.^ドアは開けたままにしてください。;;例^I'll leave it up to you.^それはあなたにお任せします。\n48 | level | 形 | 平らな | 「レベル」以外の形容詞の意味。 | a [[level]] surface | [[平らな]]面 |\n49 | line | 名 | ラインナップ／列 | 「線、電話(線)、路線、行」以外の意味。動詞の用法はパート1重要語No.12を参照。 | a new [[line]] of shoes | 靴の新しい[[ラインナップ]] | 例^They're waiting in line.^彼らは列で待っている。\n50 | lot | 名 | (ある目的用の小さな)土地 | 「たくさん」以外の名詞の意味。 | a parking [[lot]] | 駐車[[場]] |\n51 | lower | 動 | 下げる | 形容詞low(低い)の比較級以外の動詞の意味。 | [[lower]] the price | 価格を[[下げる]] |\n52 | makeup | 形 | 埋め合わせ | 「メーキャップ」以外の意味。 | the [[makeup]] date | [[代替日]] |\n53 | manage | 動 | なんとか〜する(manage to doの形で)／うまく対処する | 「管理する、経営する」以外の意味。 | I [[managed]] to finish the task. | 私は[[なんとか]]その仕事を[[終えまし]]た。 | 例^I can manage it alone.^一人でうまく対処できます。\n54 | margin | 名 | 利益(率)、マージン／差／余白 | | profit [[margins]] | [[利幅]] | 例^by a wide margin^大差で;;例^adjust the margins^余白を調整する\n55 | mark | 動 | 記念する | 「印(を付ける)、マーク(を付ける)」以外の意味。 | Today [[marks]] our tenth anniversary. | 今日は当社の10周年[[記念]]です。 |\n56 | market | 動 | 市場に出す、売り込む | 「市場」以外の動詞の意味。 | [[market]] a function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rd(s){return esc(s).replace(/\[\[(.*?)\]\]/g,'<span class="red">$1</span>')}
function strip(s){return String(s||'').replace(/\[\[|\]\]/g,'')}
function st(id){return S.stats[id]||{seen:0,ok:0,to:0,ms:0,streak:0}}
function status(id){var s=st(id);if(!s.seen)return 'new';return s.streak>=2?'done':'rev'}
function mist(k){var s=st(k);return s.seen>0&&s.ok/s.seen<TH}
function sec(id){return S.sections.filter(function(x){return x.id===id})[0]}
function secName(id){return id==='mis'?'間違えた問題':(sec(id)||{name:''}).name}

function counts(s){var d=0,r=0,n=0;s.words.forEach(function(w){var k=status(w.id);if(k==='done')d++;else if(k==='rev')r++;else n++});return{d:d,r:r,n:n,t:s.words.length}}
function pct(a,b){return b?Math.round(a/b*100):0}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function items(sid,mode,scope){

ws.forEach(function(w){

function parseDer(s){return String(s||'').split(';;').map(function(x){var p=x.split('^');return p.length>=3?{t:p[0].trim(),en:p[1].trim(),ja:p.slice(2).join('^').trim()}:null}).filter(function(x){return x&&x.en})}
function upsert(s,w){var ex=s.words.filter(function(x){return x.en.toLowerCase()===w.en.toLowerCase()})[0];
if(ex){if(w.no)ex.no=w.no;ex.pos=w.pos;ex.ja=w.ja;ex.memo=w.memo||'';if(w.ex)ex.ex=w.ex;if(w.exja)ex.exja=w.exja;if(w.der&&w.der.length)ex.der=w.der;return 'upd'}
s.words.push({id:s.id+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:w.no||0,en:w.en,pos:w.pos||'',ja:w.ja,memo:w.memo||'',ex:w.ex||'',exja:w.exja||'',der:w.der||[]});return 'add'}
function parse(text,s){var add=0,upd=0;text.split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;
var p=l.split(/\s*[|｜\t]\s*/),w,no=0;if(p.length>=3&&/^\d{1,4}$/.test(p[0].trim()))no=+p.shift();
if(p.length>=4)w={en:p[0],pos:p[1],ja:p[2],memo:p[3]||'',ex:p[4]||'',exja:p[5]||'',der:parseDer(p[6])};
else if(p.length===3)w={en:p[0],pos:p[1],ja:p[2]};else if(p.length===2)w={en:p[0],pos:'',ja:p[1]};else return;
w.en=w.en.trim();w.no=no;if(!w.en||!w.ja)return;
if(upsert(s,w)==='add')add++;else upd++});
s.words.sort(function(a,b){return (a.no||1e9)-(b.no||1e9)});return{add:add,upd:upd}}

R.addw=function(){return '<button class="link" data-a="sec" data-i="'+V.id+'">‹ 戻る</button><h2>単語を追加</h2><div class="sub">1行に1語。区切りは「|」です。<br>（番号 | ）英単語 | 品詞 | 意味 | 補足 | 例文 | 例文の和訳 | 派生語<br>・先頭に番号（例：061）を付けると、番号順に並びます。<br>・例文と和訳では、赤字にしたい部分を [[ ]] で囲みます。<br>・補足が複数なら「//」で区切ります。<br>・派生語は「種類^英語^和訳」を「;;」でつなぎます（種類は 動 名 形 副 前 接 類 同 反 関 例 略 複）。<br>・後ろの項目は省略できます。同じ英単語は上書きされ、空の例文・派生語では消えません。</div><textarea id="tx" placeholder="confirm | 動 | 確認する | ※他動詞 | Please [[confirm]] your reservation. | ご予約を[[確認して]]ください。 | 名^confirmation^確認;;名^confirmation number^確認番号"></textarea><button class="pri full" data-a="doadd">追加する</button><div id="msg" class="sub"></div>'};
R.setup=function(){var all=items(V.id,V.mode,V.scope),rv=all.filter(function(i){return status(i.k)!=='done'}),o='';
[10,20,50,100].forEach(function(n){o+='<button data-a="cnt" data-n="'+n+'" class="'+(V.cnt===n?'sel':'')+'">'+n+'問</button>'});
var rng=V.id==='mis'?'':'<div class="sub">出題範囲</div><div class="two" style="margin:8px 0 16px"><button data-a="md" data-m="all" class="'+(V.md==='all'?'sel':'')+'">すべて ('+all.length+')</button><button data-a="md" data-m="rev" class="'+(V.md==='rev'?'sel':'')+'">要復習・未学習 ('+rv.length+')</button></div>';
return '<button class="link" data-a="back">‹ 戻る</button><h2>'+esc(secTitle(V.id,V.scope))+'</h2><div class="sub" style="margin-bottom:12px">'+MODES[V.mode]+'</div><div class="sub">問題数</div><div class="grid4" style="margin:8px 0 16px">'+o+'</div>'+rng+'<div class="sub">毎回シャッフルされます。開始の3秒前からカウントダウンします。'+(V.mode==='e'?'例文は時間制限なしです。':V.mode==='all'?'例文以外は、1問5秒以内に「解説へ」を押せないと「わからない」になります。':'1問5秒以内に「解説へ」を押せないと「わからない」になります。')+'</div><button class="pri full" data-a="start" style="margin-top:16px">スタート</button>'+(V.err?'<div class="sub" style="color:var(--ng)">'+V.err+'</div>':'')};
R.count=function(){return '<div class="cd" id="cd">'+V.n+'</div><div class="sub st">準備してください</div>'};
R.card=function(){var it=V.q[V.i],w=it.w,last=V.i+1>=V.q.length,front,back='';
if(it.kind==='w'){front='<div class="en">'+esc(w.en)+'</div><div class="pos">'+esc(w.pos)+'</div>';
back='<div class="box">'+jaH(w)+'</div>'+(w.ex?'<div class="box"><b>例文</b><div class="exs">'+rd(w.ex)+'</div><div>'+rd(w.exja)+'</div></div>':'');
if(w.memo)back+='<div class="box"><b>補足</b>'+w.memo.split('//').map(function(x){return '<div>'+esc(x.trim())+'</div>'}).join('')+'</div>'}
else if(it.kind==='e'){front='<div class="sub" style="margin-bottom:10px">和訳を考えてください（時間制限なし）</div><div class="exs" style="font-size:22px">'+rd(w.ex)+'</div>';
back='<div class="box"><b>和訳</b><div>'+rd(w.exja)+'</div></div><div class="box"><b>この例文の単語</b><div><b>'+esc(w.en)+'</b></div>'+jaH(w)+'</div>'}
else{front='<div class="en" style="font-size:32px">'+esc(it.d.en)+'</div>';
var oth=(w.der||[]).filter(function(x){return x!==it.d});
back='<div class="box"><div class="ja">'+esc(it.d.ja)+'</div><div class="sub">この派生語の種類：<span class="tag" style="margin:0">'+esc(it.d.t)+'</span></div></div><div class="box"><b>元の単語</b><div><b>'+esc(w.en)+'</b></div>'+jaH(w)+'</div><div class="box"><b>この単語のほかの派生語</b>'+(oth.length?oth.map(function(x){return '<div class="wl"><span class="tag" style="margin:0 6px 0 0">'+esc(x.t)+'</span><b>'+esc(x.en)+'</b>　'+esc(x.ja)+'</div>'}).join(''):'<div class="sub">なし</div>')+'</div>'}
var h='<div class="row sp sub"><span>'+(V.i+1)+' / '+V.q.length+'</span><button class="link" data-a="quit">中止</button></div><div class="tm"'+(V.rev||it.kind==='e'?' style="visibility:hidden"':'')+'><i id="tb"></i></div><div class="card" style="padding:'+(it.kind==='e'?'28':'40')+'px 16px">'+front+'</div>';
if(!V.rev)return h+'<button class="pri full" data-a="reveal" style="padding:18px;font-size:17px">解説へ</button>';
h+=(V.done?'<div class="res x">時間切れ（自動で「わからない」にしました）</div>':'')+back;
if(V.done)return h+'<button class="pri full" data-a="next">'+(last?'結果を見る':'次の問題へ')+'</button>';
return h+'<div class="sub" style="margin-top:12px">解説を見る前に、意味を思い出せていましたか？</div><div class="two" style="margin-top:8px"><button class="bng" data-a="ans" data-v="0">× わからない</button><button class="bok" data-a="ans" data-v="1">✓ わかる</button></div>'};
R.result=function(){var q=V.log,ok=q.filter(function(x){return x.ok}).length,to=q.filter(function(x){return x.to}).length,wrong=q.filter(function(x){return !x.ok}),box;
if(V.id==='mis'){box='<div class="st"><div class="big">'+items('mis','all',V.scope).length+'</div><div>間違えた問題の残り</div></div>'}
else{var p=items(V.id,V.mode),d=p.filter(function(i){return status(i.k)==='done'}).length,n=p.filter(function(i){return status(i.k)==='new'}).length,r=p.length-d-n;
box='<div class="two" style="margin-top:8px"><div class="st"><div class="big" style="color:var(--ok)">'+d+'</div><div>習得済み</div></div><div class="st"><div class="big" style="color:var(--ng)">'+r+'</div><div>要復習</div></div></div><div class="st" style="margin-top:8px"><div class="big">'+pct(d,p.length)+'%</div><div>習得率（未学習 '+n+'）</div></div><div class="bar"><i style="width:'+pct(d,p.length)+'%"></i></div>'}
var h='<h2>結果</h2><div class="box"><div class="two"><div class="st"><div class="big">'+q.length+'</div><div>学習した枚数</div></div><div class="st"><div class="big">'+pct(ok,q.length)+'%</div><div>今回の正解率（時間切れ '+to+'）</div></div></div></div><div class="box"><b>'+esc(secTitle(V.id,V.scope))+'　'+esc(MODES[V.mode])+'</b>'+box+'</div>';
if(wrong.length){h+='<div class="box"><b>今回わからなかった問題</b>';wrong.forEach(function(x){h+='<div class="wl"><b>'+esc(x.en)+'</b>'+(x.kind==='e'?'<span class="tag">例文</span>':x.kind==='d'?'<span class="tag">派生語</span>':'')+(x.to?'<span class="tag">時間切れ</span>':'')+'<div class="sub">'+esc(x.ja)+'</div></div>'});h+='</div>'}
return h+'<button class="pri full" data-a="setup">もう一度</button><button class="full" data-a="back">戻る</button>'};
R.words=function(){var s=sec(V.id),L=s.words.slice();
function sc(w){var t=st(w.id);if(!t.seen)return -1;return (1-t.ok/t.seen)*100+(t.ms/t.seen/1000)*5+t.to*10}
if(V.sort==='weak')L.sort(function(a,b){return sc(b)-sc(a)});
var h='<button class="link" data-a="sec" data-i="'+V.id+'">‹ 戻る</button><h2>単語ごとの成績</h2><div class="two"><button data-a="sort" data-s="weak" class="'+(V.sort==='weak'?'sel':'')+'">苦手順</button><button data-a="sort" data-s="ord" class="'+(V.sort!=='weak'?'sel':'')+'">登録順</button></div><div class="sub" style="margin:6px 0">単語カードの成績です。苦手度は、不正解・回答にかかった時間・時間切れの多さで決まります。</div><div class="box">';
if(!L.length)h+='<div class="sub">単語がありません</div>';
L.forEach(function(w){var t=st(w.id),k=status(w.id);
h+='<div class="wl"><div class="row sp"><span><b>'+esc(w.en)+'</b><span class="tag">'+(k==='done'?'習得済み':k==='rev'?'要復習':'未学習')+'</span></span><span class="sub">'+(t.seen?pct(t.ok,t.seen)+'%':'―')+'</span></div><div class="sub">'+esc(w.ja)+(t.seen?'　／　'+t.ok+'/'+t.seen+'回'+(t.to?'　時間切れ '+t.to:''):'')+'</div></div>'});
return h+'</div>'};
R.backup=function(){return '<button class="link" data-a="home">‹ ホーム</button><h2>データの保存・復元</h2><div id="cl" class="sub">'+clText()+'</div><button class="full" data-a="syncnow">今すぐ同期する</button><div class="sub">進捗はこの端末のブラウザに自動保存されます。端末を変える時や念のためのバックアップには、下の文字列をコピーしてメモなどに保存し、復元時に貼り付けてください。</div><button class="full" data-a="export">バックアップ文字列を表示</button><textarea id="bk" placeholder="ここに表示／貼り付け"></textarea><button class="pri full" data-a="import">貼り付けた内容で復元（現在のデータは置き換わります）</button><div id="msg" class="sub"></div>'};

function startTimer(){clearInterval(T.iv);var t0=performance.now();V.t0=t0;if(V.q[V.i].kind==='e')return;var b=document.getElementById('tb');
T.iv=setInterval(function(){var e=performance.now()-t0;if(b)b.style.width=Math.max(0,100-e/LIMIT*100)+'%';if(e>=LIMIT){clearInterval(T.iv);answer(false,true,LIMIT)}},40)}
function answer(ok,to,ms){clearInterval(T.iv);var it=V.q[V.i],t=S.stats[it.k]||(S.stats[it.k]={seen:0,ok:0,to:0,ms:0,streak:0});
t.seen++;t.ms+=ms;if(ok){t.ok++;t.streak++}else{t.streak=0}if(to)t.to++;save();
var l=lab(it);V.log.push({en:l.en,ja:l.ja,ok:ok,to:to,kind:it.kind});
if(to){V.rev=1;V.done=1;V.name='card';render()}else adv()}
function adv(){if(V.i+1>=V.q.length){V.name='result';render()}else{V.i++;V.rev=0;V.done=0;V.name='card';render();toTop()}}
function startCount(){var pool=items(V.id,V.mode,V.scope);
if(V.md==='rev'&&V.id!=='mis')pool=pool.filter(function(i){return status(i.k)!=='done'});
if(!pool.length){V.err='出題できる問題がありません。範囲を変えてください。';render();return}
V.q=shuffle(pool).slice(0,V.cnt);V.i=0;V.rev=0;V.done=0;V.log=[];V.n=3;V.err='';V.name='count';render();
T.iv=setInterval(function(){V.n--;if(V.n<=0){clearInterval(T.iv);V.name='card';render()}else{var e=document.getElementById('cd');if(e)e.textContent=V.n}},1000)}

document.getElementById('app').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;var a=b.dataset.a;
if(a==='home')go('home');
else if(a==='sec')go('sec',{id:b.dataset.i||V.id});
else if(a==='mis')go('mis',{id:'mis',scope:'all'});
else if(a==='scope'){V.scope=b.dataset.s;render()}
else if(a==='back')go(V.id==='mis'?'mis':'sec',{id:V.id,scope:V.scope});
else if(a==='addsec'){var n=document.getElementById('nn').value.trim();if(!n)return;S.sections.push({id:'s'+Date.now().toString(36),name:n,words:[]});save();go('home')}
else if(a==='addw')go('addw',{id:V.id});
else if(a==='doadd'){var s=sec(V.id),r=parse(document.getElementById('tx').value,s);save();document.getElementById('msg').textContent='追加 '+r.add+' 語、更新 '+r.upd+' 語';if(r.add+r.upd)document.getElementById('tx').value=''}
else if(a==='setup')go('setup',{id:V.id,scope:V.scope,mode:b.dataset.m||V.mode,cnt:V.cnt||10,md:V.md||'all'});
else if(a==='cnt'){V.cnt=+b.dataset.n;render()}
else if(a==='md'){V.md=b.dataset.m;render()}
else if(a==='start')startCount();
else if(a==='reveal'){clearInterval(T.iv);V.ms=Math.min(LIMIT*6,performance.now()-V.t0);V.rev=1;render()}
else if(a==='ans')answer(b.dataset.v==='1',false,V.ms);
else if(a==='next')adv();
else if(a==='quit'){clearInterval(T.iv);if(V.log.length){V.name='result';render()}else go(V.id==='mis'?'mis':'sec',{id:V.id,scope:V.scope})}
else if(a==='words')go('words',{id:V.id,sort:'weak'});
else if(a==='sort'){V.sort=b.dataset.s;render()}
else if(a==='del'){if(V.cf){var s2=sec(V.id);s2.words.forEach(function(w){Object.keys(S.stats).forEach(function(k){if(k.indexOf(w.id)===0)delete S.stats[k]})});S.sections=S.sections.filter(function(x){return x.id!==V.id});if(!S.sections.length)S.sections.push({id:'s1',name:'1–100',words:[]});save();go('home')}else{V.cf=1;render()}}
else if(a==='backup')go('backup');
else if(a==='syncnow'){if(CL.col){CL.msg='同期中…';clShow();pull(true)}else{clShow()}}
else if(a==='export'){document.getElementById('bk').value=JSON.stringify(S)}
else if(a==='import'){var m=document.getElementById('msg');try{var d=JSON.parse(document.getElementById('bk').value);if(!d||!d.sections||!d.stats)throw 0;S=d;save();m.textContent='復元しました'}catch(x){m.textContent='読み込めませんでした。バックアップ文字列をそのまま貼り付けてください。'}}
});

var CL={col:null,t:null,st:'off',msg:''};
function clText(){if(CL.st==='on')return '☁ Claudeアカウントで同期中（学習記録を自動でクラウドに保存します）'+(CL.msg?'<br>'+CL.msg:'');if(CL.st==='err')return '☁ 同期でエラーが出ました。しばらくしてから「今すぐ同期する」を押してください。'+(CL.msg?'<br>'+CL.msg:'');return '☁ 同期は使えない状態です。claude.ai（またはClaudeアプリ）にログインした状態でこのページを開くと、同じアカウントのどの端末でも進捗が同期されます。'}
function clShow(){var e=document.getElementById('cl');if(e)e.innerHTML=clText()}
function stMerge(a,b){var o={},ch=0,k;for(k in a)o[k]=a[k];for(k in b){var x=o[k],y=b[k];if(!x||(y&&(y.seen||0)>(x.seen||0))){o[k]=y;ch=1}}return {m:o,ch:ch}}
function syncSoon(){if(!CL.col)return;clearTimeout(CL.t);CL.t=setTimeout(push,4000)}
function tm(){var d=new Date();return d.getHours()+':'+('0'+d.getMinutes()).slice(-2)}
async function push(){if(!CL.col)return;try{var ks=Object.keys(S.stats),n=700,cnt=0;for(var i=0;i<ks.length;i+=n){var c={};ks.slice(i,i+n).forEach(function(k){c[k]=S.stats[k]});await CL.col.doc('p'+cnt).set({s:c});cnt++}await CL.col.doc('meta').set({n:cnt,t:Date.now()});CL.st='on';CL.msg='最終同期 '+tm()}catch(e){CL.st='err';CL.msg=''}clShow()}
async function pull(manual){try{var m=await CL.col.doc('meta').get(),r={};if(m.exists){var cnt=(m.data()||{}).n||0;for(var i=0;i<cnt;i++){var s=await CL.col.doc('p'+i).get();if(s.exists){var d=(s.data()||{}).s||{};for(var k in d)r[k]=d[k]}}}
var mg=stMerge(S.stats,r);S.stats=mg.m;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
await push();if(mg.ch&&['home','sec','mis','backup','words'].indexOf(V.name)>=0)render()}catch(e){CL.st='err';CL.msg='';clShow()}}
(async function(){try{var c=window.claude;if(!c||!c.use)return;var db=await c.use('db'),us=await c.use('user');if(!db||!us)return;var id=await us.id();if(!id)return;CL.col=db.collection('data/users/'+id);CL.st='on';await pull()}catch(e){CL.st='err'}})();
render();
</script>
